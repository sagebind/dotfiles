[env]
AWS_VAULT_BACKEND = "file"
AWS_VAULT_PROMPT = "osascript"

[tools]
"age" = "latest"
"aws-vault" = "latest"
"github:buildkite/buildkite-mcp-server" = "latest"
"github:buildkite/cli" = "latest"
"github:karust/openserp" = "0.8.6"
"nono" = "latest"
"pipx:yubikey-manager" = "latest"
"pitchfork" = "latest"

[tools."http:helm2"]
version = "2.16.2"
url = "https://get.helm.sh/helm-v2.16.2-darwin-amd64.tar.gz"
checksum = "sha256:8bee3a69bd873c09dd07dc12594837f03a13b443727c7ce76db7b779c4ee9794"
rename_exe = "helm2"
os = ["macos"]

[tasks.aws-credential-process]
env.AWS_VAULT_FILE_PASSPHRASE = "op://Employee/aws-vault keychain/password"
run = 'op run -- aws-vault exec aws-users --duration 10h --json'
